name: Release

run-name: "Release — ${{ github.actor }} — ${{ inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Release reason (e.g. 'v1.1.0 — add TransactionCategory')"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel an in-progress release

permissions:
  contents: write      # Create tags and GitHub Releases
  issues: write        # Allow semantic-release to comment on issues
  pull-requests: write # Allow semantic-release to comment on PRs
  id-token: write      # OIDC — npm Trusted Publishing + provenance attestation

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # The production environment requires manual approval from a designated
    # reviewer before this job proceeds. Configure at:
    # Settings → Environments → production → Required reviewers → add yourself
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Lint, type-check, and tests are intentionally omitted here.
        # workflow_dispatch can only be triggered on main, which has already
        # passed the full CI gate via PR. Re-running here adds latency
        # without adding safety.
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Required by @semantic-release/git for the push-back commit
          # ── npm authentication ────────────────────────────────────────────
          # STAGE A (bootstrap): uncomment NPM_TOKEN below for the very first
          # publish only, then revoke the token and delete this line.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          run: |
           npm config get registry
           npm whoami
          #
          # STAGE B (permanent): npm Trusted Publishing via OIDC.
          # No token needed — the npm CLI authenticates automatically using
          # the short-lived OIDC token issued by id-token: write above,
          # against the Trusted Publisher configured at:
          # npmjs.com/package/@fm-budget-control/budget-core/access
