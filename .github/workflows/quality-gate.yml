name: Quality Gate

on:
  workflow_call:
    inputs:
      skip_sonar:
        description: "Skip the SonarCloud analysis job (used for pre-PR feature-branch runs)"
        required: false
        type: boolean
        default: false

    secrets:
      SONAR_TOKEN:
        required: true

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # SonarCloud PR decoration

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run type specs
        run: npm run test:types

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean previous coverage
        run: rm -rf coverage

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Verify generated coverage report
        run: |
          test -f coverage/lcov.info
          echo "Generated coverage report:"
          ls -la coverage/lcov.info
          echo ""
          echo "Source files in LCOV:"
          grep '^SF:' coverage/lcov.info
          echo ""
          echo "Coverage counters:"
          grep '^LF:\|^LH:' coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.skip_sonar }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-report
          path: coverage/

      - name: Confirm coverage file exists
        run: ls -la coverage/

      - name: Debug LCOV paths
        run: |
          echo "LCOV exists:"
          ls -la coverage/lcov.info
          echo ""
          echo "First SF entries:"
          grep '^SF:' coverage/lcov.info | head -30
          echo ""
          echo "Project files:"
          find src -type f | sort | head -80

      - name: Clean Sonar workspace
        run: rm -rf .scannerwork

      - name: Resolve package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v4.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.pkg.outputs.version }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test  # Parallel with sonar — both depend on test, neither depends on the other
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
