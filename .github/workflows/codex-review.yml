name: Codex Review

run-name: "Codex Review — PR #${{ github.event.pull_request.number }} — ${{ github.actor }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  codex-review:
    name: Codex Review
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout pull request merge ref
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull request base and head
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-review-output.md
          sandbox: read-only

      - name: Upload Codex review output
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-output
          path: codex-review-output.md

      - name: Comment Codex review on PR
        if: steps.codex.outputs.final-message != ''
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW: ${{ steps.codex.outputs.final-message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              "## Codex Review",
              "",
              process.env.CODEX_REVIEW,
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Fail when Codex reports blocking findings
        env:
          CODEX_REVIEW: ${{ steps.codex.outputs.final-message }}
        run: |
          if printf '%s\n' "$CODEX_REVIEW" | grep -q '^CODEX_REVIEW_FAIL'; then
            echo "Codex found blocking review findings."
            exit 1
          fi

          if printf '%s\n' "$CODEX_REVIEW" | grep -q '^CODEX_REVIEW_PASS'; then
            echo "Codex review passed."
            exit 0
          fi

          echo "Codex review did not return the expected pass/fail marker."
          exit 1
