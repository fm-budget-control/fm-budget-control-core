# sonar-project.properties
# SonarCloud configuration for @fm-budget-control/budget-core
# https://docs.sonarsource.com/sonarcloud/
 
sonar.organization=fm-budget-control
sonar.projectKey=fm-budget-control_fm-budget-control-core2
 
 
# ── Source layout ─────────────────────────────────────────────────────────────
# sonar.sources and sonar.tests must not overlap.
# Test files belong in sonar.tests — not in sonar.exclusions.
# Putting test files in both sonar.sources and sonar.exclusions causes
# inconsistent coverage mapping.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
 
# Exclude generated output and tooling config from analysis.
# Test files are handled by sonar.tests above — do not list them here.
sonar.exclusions=\
  dist/**,\
  node_modules/**,\
  coverage/**,\
  jest.config.ts,\
  jest.config.js,\
  **/*.type-spec.ts
 
# ── TypeScript ────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPath=tsconfig.json
 
# ── Coverage ──────────────────────────────────────────────────────────────────
# lcov.info is produced by Jest (npm run test:coverage) and passed between
# the test job and the sonar job via GitHub Actions artifacts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
